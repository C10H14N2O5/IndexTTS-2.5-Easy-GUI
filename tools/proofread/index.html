<body>
<header><div><h1 data-i18n="title">听音校对</h1><div class="sub" data-i18n="subtitle">识别缺失文本，逐条听音校对，再更新当前语料的清单。</div></div><span class="local" data-i18n="local">● 在 GUI 服务器本地处理</span></header>
<div class="context-bar">

</div>
<div class="pipeline">
  <section aria-labelledby="asrHeading"><div class="group"><strong id="asrHeading">SenseVoiceSmall Q8 · CPU</strong><button id="batchStart" class="primary" data-i18n="batchStart">识别缺失文本</button><button id="batchStop" data-i18n="stop" hidden>停止识别</button></div><p id="asrStatus" aria-live="polite"></p><progress id="asrProgress" class="asr-progress" max="1" value="0" hidden></progress></section>
  <section><div class="group"><button id="manifestUpdate">更新训练清单</button><span id="manifestBadge" class="badge"></span></div><p id="manifestStatus" aria-live="polite"></p><p id="manifestStats"></p><p id="manifestPath" class="manifest-path"></p></section>
</div>
<div class="layout">
  <aside><div class="progress-row"><span data-i18n="reviewProgress">校对进度</span><span id="counts">0 / 0</span></div><progress id="progress" max="1" value="0"></progress><input id="search" type="search" data-placeholder="search" data-aria="search" placeholder="搜索相对文件路径…" aria-label="搜索相对文件路径"><div class="filters" role="group" data-aria="filters"><button class="active" data-filter="all" data-i18n="all">全部</button><button data-filter="pending" data-i18n="pending">未校对</button><button data-filter="done" data-i18n="done">已校对</button></div><nav id="fileList" data-aria="audioFiles" aria-label="音频文件"></nav></aside>
  <main><div id="message" class="status" role="status" aria-live="polite" hidden></div><div id="empty" class="empty"><strong data-i18n="emptyTitle">从一段声音开始</strong><span data-i18n="emptyBody">在上方选择项目语料目录，或直接填写服务器目录。缺少 TXT 时，可一键识别后继续校对。</span></div>
    <section id="workspace" class="card" hidden>
      <div class="title-row"><div><h2 id="filename"></h2><div class="sub" id="position"></div></div><span id="reviewBadge" class="badge"></span></div>
      <div class="audio-box"><audio id="audio" controls preload="metadata"></audio><div class="audio-tools"><button id="replay" data-i18n="replay">↻ 从头重播</button><label><span data-i18n="speed">播放速度</span> <select id="speed"><option value="0.75">0.75 ×</option><option value="1" selected>1 ×</option><option value="1.25">1.25 ×</option><option value="1.5">1.5 ×</option></select></label></div></div>
      <div class="editor-label"><label for="editor" data-i18n="text">对应文本</label><span id="dirty"></span></div><textarea id="editor" spellcheck="false" data-placeholder="editorPlaceholder" placeholder="听音后输入对应文本…"></textarea><div class="editor-note"><span data-i18n="editorNote">保留原话、重复与语气词；不补全音频里没有的话。</span><span id="charCount"></span></div>
      <div class="actions"><div class="group"><button id="previous" data-i18n="previous">← 上一条</button><button id="next" data-i18n="next">下一条 →</button></div><div class="group"><button id="save" data-i18n="save">保存</button><button id="saveNext" class="primary" data-i18n="saveNext">保存并下一条 →</button></div></div>
      <div class="secondary-actions"><button id="review" class="text-button"></button><button id="retranscribe" class="text-button" data-i18n="retranscribe">重新识别当前条目</button><button id="reload" class="text-button" data-i18n="reload">重新加载磁盘文本</button></div>
    </section>
    <div class="shortcuts"><span><kbd>Ctrl S</kbd> <span data-i18n="save">保存</span></span><span><kbd>Ctrl Enter</kbd> <span data-i18n="saveNextShort">保存并下一条</span></span><span><kbd>Alt Space</kbd> <span data-i18n="playPause">播放 / 暂停</span></span></div>
  </main>
</div>
<dialog id="unsaved"><h3 data-i18n="unsavedTitle">当前文本尚未保存</h3><p data-i18n="unsavedBody">先保存这次修改，还是放弃修改并继续？</p><div class="dialog-actions"><button data-choice="cancel" data-i18n="cancel">取消</button><button data-choice="discard" data-i18n="discard">放弃修改</button><button data-choice="save" class="primary" data-i18n="saveContinue">保存并继续</button></div></dialog>

async function api(path, body) {
  const options = {headers:{'X-Session-Token':token}, cache:'no-store'};
  if (body !== undefined) { options.method='POST'; options.headers['Content-Type']='application/json'; options.body=JSON.stringify(body); }
  const response = await fetch(`api/${path}`, options);
  let data;

  return data;

function visible() {
  const q = $('search').value.trim().toLocaleLowerCase();
  return items.filter(item => item.name.toLocaleLowerCase().includes(q) && (filter === 'all' || (filter === 'done' ? item.reviewed : !item.reviewed)));
}
function paint() {
  const done = items.filter(item => item.reviewed).length;
  $('counts').textContent = `${done} / ${items.length}`;
  $('progress').max = items.length || 1; $('progress').value = done;
  const dataset = t(context.role === 'validation' ? 'validationDataset' : 'trainingDataset');
  $('projectLabel').textContent = context.project ? t('project',{name:context.project,dataset}) : t('noProject');
  const list = $('fileList'), scrollTop = list.scrollTop;
  list.replaceChildren();
  for (const item of visible()) {
    const button=document.createElement('button'); button.className='file'+(current?.id===item.id?' active':''); button.disabled=busy; button.title=item.name; button.setAttribute('aria-current',current?.id===item.id?'true':'false');
    const dot=document.createElement('span'); dot.className='dot'+(item.reviewed?' done':''); dot.textContent=item.reviewed?'✓':''; dot.setAttribute('aria-label',t(item.reviewed?'done':'pending'));
    const name=document.createElement('span'); name.className='name'; name.textContent=item.name; button.append(dot,name);
    if (item.missing_text) { const missing=document.createElement('span'); missing.className='missing'; missing.textContent=t('missing'); button.append(missing); }
    button.onclick=()=>run(()=>switchTo(item.id)); list.append(button);
  }
  if (!list.childElementCount) { const empty=document.createElement('div'); empty.className='list-empty'; empty.textContent=t(items.length?'noMatches':'noAudio'); list.append(empty); }
  list.scrollTop=scrollTop;
  paintPipeline(); updateControls();
}
function paintPipeline() {
  const job=asr.job || {}, progressValues={completed:job.completed||0,total:job.total||0,succeeded:job.succeeded||0,skipped:job.skipped||0,failed:job.failed||0,current:job.current||'…'};
  let text = !ready ? t('modelChecking') : asr.available ? t('modelReady') : (asr.message || t('operationFailed'));
  if (job.running) text=t('batchWorking',progressValues);
  else if (job.error) text=job.error;
  else if (job.cancelled) text=t('batchCancelled',progressValues);
  else if (job.total || job.completed) text=t('batchFinished',progressValues);
  $('asrStatus').textContent=text; $('asrStatus').classList.toggle('error',Boolean(job.error) || (ready&&!asr.available));
  $('asrProgress').hidden=!job.running; $('asrProgress').max=job.total||1; $('asrProgress').value=job.completed||0;
  $('batchStop').hidden=!job.running;
  $('manifestUpdate').textContent=t(context.role==='validation'?'updateValidationManifest':'updateManifest');
  $('manifestBadge').textContent=context.project && manifest ? t(manifest.available===false?'notReady':manifest.stale?'stale':'upToDate') : '';
  $('manifestBadge').classList.toggle('done',Boolean(manifest&&manifest.available!==false&&!manifest.stale));
  const statusLabel={missing:'manifestMissing',stale:'manifestStale',ready:'manifestReady'}[manifest?.status];
  $('manifestStatus').textContent=context.project ? (statusLabel?t(statusLabel):manifest?.message||'') : t('noManifestProject');
  $('manifestStatus').classList.toggle('warning',Boolean(manifest?.stale));
  const stats=manifest?.stats;
  $('manifestStats').textContent=Number.isFinite(stats?.samples) && Number.isFinite(stats?.valid)
    ? t('manifestStats',{samples:stats.samples,valid:stats.valid,filtered:stats.samples-stats.valid,missing:stats.missing_text||0}) : '';
  $('manifestPath').textContent=manifest?.manifest || '';
}
function updateControls() {
  const list=visible(), at=current?list.findIndex(item=>item.id===current.id):-1;
  for (const id of ['selectDir','directoryInput']) $(id).disabled=busy||jobRunning();
  for (const id of ['search','speed','refreshList']) $(id).disabled=busy;
  document.querySelectorAll('[data-filter]').forEach(button=>button.disabled=busy);
  for (const id of ['save','saveNext','review','reload','replay']) $(id).disabled=busy||!current;
  $('retranscribe').disabled=busy||!current||jobRunning()||!asr.available;
  $('editor').disabled=busy||!current;
  $('previous').disabled=busy||at<=0; $('next').disabled=busy||at<0||at>=list.length-1;
  $('batchStart').disabled=busy||jobRunning()||Boolean(asr.directory_running)||!context.directory||!asr.available;
  $('batchStop').disabled=busy||!jobRunning();
  $('manifestUpdate').disabled=busy||jobRunning()||!context.project||!context.directory||manifest?.available===false||Boolean(manifest?.training_running)||Boolean(manifest?.asr_running);
  $('dirty').textContent=t(dirty()?'dirty':'saved'); $('charCount').textContent=t('chars',{count:Array.from($('editor').value).length});
  if (current) {
    $('position').textContent=at>=0?t('position',{index:at+1,total:list.length}):t('outsideFilter');
    $('reviewBadge').textContent=t(current.reviewed&&!dirty()?'done':'pending'); $('reviewBadge').classList.toggle('done',current.reviewed&&!dirty());
    $('review').textContent=t(current.reviewed&&!dirty()?'unmarkReview':'markReview');
  }
}
async function run(fn) {
  if (busy) return false;
  busy=true; paint();
  try { return await fn(); } catch (error) { message(error.message,true); return false; }
  finally { busy=false; paint(); drainContext(); }
}
function updateItem(data) {
  current=data; $('editor').value=data.text; original=$('editor').value;
  const row=items.find(item=>item.id===data.id); if(row) { row.reviewed=data.reviewed; row.missing_text=!data.text.trim(); }
  paint();
}
async function load(id) {
  const data=await api(`item?id=${encodeURIComponent(id)}`);
  $('audio').pause(); updateItem(data); $('filename').textContent=data.name;
  $('audio').src=`api/audio?id=${encodeURIComponent(id)}&token=${encodeURIComponent(token)}`;
  $('audio').load(); $('audio').playbackRate=Number($('speed').value);
  $('workspace').hidden=false; $('empty').hidden=true;
  await api('position',{id});
}
function askUnsaved() {
  return new Promise(resolve=>{
    const dialog=$('unsaved');
    const click=event=>{ const button=event.target.closest('[data-choice]'); if(button) finish(button.dataset.choice); };
    const cancel=event=>{ event.preventDefault(); finish('cancel'); };
    function finish(value) { dialog.removeEventListener('click',click); dialog.removeEventListener('cancel',cancel); dialog.close(); resolve(value); }
    dialog.addEventListener('click',click); dialog.addEventListener('cancel',cancel); dialog.showModal();
  });
}
async function allowLeave() {
  if(!dirty()) return true;
  const answer=await askUnsaved();
  if(answer==='cancel') return false;
  return answer==='save' ? await save(false) : true;
}
async function switchTo(id) { if(current?.id===id || !await allowLeave()) return; message(''); await load(id); }
async function save(reviewed) {
  if(!current) return false;
  if(!$('editor').value.trim()) { message(t('blankText'),true); return false; }
  reviewed=reviewed||(!dirty()&&current.reviewed);
  updateItem(await api('save',{id:current.id,text:$('editor').value,version:current.version,reviewed}));
  await refreshManifest(); message(t(reviewed?'savedReview':'savedText')); notify('proofread-updated',{...context}); return true;
}
async function saveNext() {
  const before=visible(), at=before.findIndex(item=>item.id===current.id), next=at>=0?before[at+1]:null;
  if(!await save(true)) return;
  if(next) { await load(next.id); message(t('savedPrevious')); } else message(t('lastItem'));
}
function clearEditor() {
  current=null; original=''; $('editor').value=''; $('filename').textContent=''; $('audio').pause(); $('audio').removeAttribute('src'); $('audio').load(); $('workspace').hidden=true; $('empty').hidden=false;
}
async function acceptSnapshot(data) {
  token=data.token||token; context={directory:data.directory||'',project:data.project||'',language:data.language||'ZH',role:datasetRole(data.role)};
  $('directoryInput').value=context.directory; items=data.items||[]; if(data.asr) asr=data.asr;
  clearEditor(); manifest=null; paint();
  if(items.length) await load(items.some(item=>item.id===data.last_id)?data.last_id:items[0].id);
  else if(context.directory) message(t('noAudio'));
  await refreshManifest();
}
async function refreshManifest() {
  if(!context.project) { manifest=null; paintPipeline(); return; }
  const version=contextVersion;
  try { const data=await api('manifest/status'); if(version===contextVersion && (!data.role || data.role===context.role)) manifest=data; }
  catch(error) { if(version===contextVersion) manifest={stale:true,message:error.message}; }
  paintPipeline(); updateControls();
}
async function refreshSnapshot(background=false) {
  const version=contextVersion, activeId=current?.id, activeVersion=current?.version;
  const data=await api('session');
  if(version!==contextVersion || datasetRole(data.role)!==context.role || (background&&busy)) return;
  items=data.items||[]; if(data.asr) asr=data.asr;
  // Polling must never replace unsaved text or switch the user's active clip.
  if(activeId && current?.id===activeId && items.some(item=>item.id===activeId) && !dirty()) {
    const disk=await api(`item?id=${encodeURIComponent(activeId)}`);
    if(version===contextVersion && current?.id===activeId && current?.version===activeVersion && !dirty() && (!background||!busy)) updateItem(disk);
  }
  paint();
}
function samePath(a,b) { return String(a||'').replace(/\\/g,'/').replace(/\/+$/,'').toLocaleLowerCase()===String(b||'').replace(/\\/g,'/').replace(/\/+$/,'').toLocaleLowerCase(); }
async function changeContext(next, fromParent=false) {
  const candidate={directory:String(next.directory||'').trim(),project:String(next.project||''),language:String(next.language||'ZH'),role:datasetRole(next.role)};
  if(next.ui_language) { locale=next.ui_language==='en_US'?'en_US':'zh_CN'; localize(); }
  if(samePath(candidate.directory,context.directory)&&candidate.project===context.project&&candidate.language===context.language&&candidate.role===context.role) { await refreshManifest(); return true; }
  if(jobRunning()) { message(t('batchSwitchBlocked'),true); if(fromParent) notify('proofread-context-rejected',{...context}); $('directoryInput').value=context.directory; return false; }
  if(!await allowLeave()) { message(t('contextRetained')); if(fromParent) notify('proofread-context-rejected',{...context}); $('directoryInput').value=context.directory; return false; }
  try {
    const data=await api('select',candidate); contextVersion++; await acceptSnapshot(data); message(context.directory?t('folderLoaded'):'');
    if(!fromParent) notify('proofread-updated',{...context});
    return true;
  } catch(error) { if(fromParent) notify('proofread-context-rejected',{...context}); $('directoryInput').value=context.directory; throw error; }
}
function drainContext() {
  if(!ready||busy||!pendingContext) return;
  const next=pendingContext; pendingContext=null;
  run(()=>changeContext(next,true));
}
async function poll() {
  if(!ready||busy||polling||!context.directory) return;
  polling=true; const version=contextVersion, wasRunning=jobRunning();
  try {
    const status=await api('asr/status');
    if(version!==contextVersion) return;
    asr=status;
    if(!busy) { await refreshSnapshot(true); if(version===contextVersion) await refreshManifest(); }
    if(version!==contextVersion) return;
    if(wasRunning&&!jobRunning()) notify('proofread-updated',{...context});
    paint();
  } catch(error) { if(version===contextVersion) message(error.message,true); }
  finally { polling=false; }
}
$('selectDir').onclick=()=>run(async()=>{
  const directory=$('directoryInput').value.trim(); if(!directory) { message(t('chooseFolder'),true); return; }
  await changeContext({...context,directory});
});
$('directoryInput').addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();$('selectDir').click();}});
$('refreshList').onclick=()=>run(async()=>{await refreshSnapshot();await refreshManifest();});
$('search').oninput=paint;
document.querySelectorAll('[data-filter]').forEach(button=>button.onclick=()=>{filter=button.dataset.filter;document.querySelectorAll('[data-filter]').forEach(other=>other.classList.toggle('active',other===button));paint();});
$('editor').oninput=updateControls;
$('save').onclick=()=>run(()=>save(false)); $('saveNext').onclick=()=>run(saveNext);
for(const [id,delta] of [['previous',-1],['next',1]]) $(id).onclick=()=>run(async()=>{const list=visible(),at=list.findIndex(item=>item.id===current.id);if(at>=0&&list[at+delta])await switchTo(list[at+delta].id);});
$('review').onclick=()=>run(async()=>{
  const reviewed=!(current.reviewed&&!dirty()); if(dirty()&&!await save(false))return;
  updateItem(await api('review',{id:current.id,version:current.version,reviewed})); message(t(current.reviewed?'reviewed':'unreviewed'));
});
$('reload').onclick=()=>run(async()=>{if(dirty()&&!confirm(t('reloadConfirm')))return;await load(current.id);message(t('reloaded'));});
$('speed').onchange=()=>{$('audio').playbackRate=Number($('speed').value);};
$('replay').onclick=()=>{$('audio').currentTime=0;$('audio').play().catch(error=>message(t('playError',{error:error.message}),true));};
$('audio').addEventListener('error',()=>{if(current&&$('audio').getAttribute('src'))message(t('audioError'),true);});
$('batchStart').onclick=()=>run(async()=>{
  if(!await allowLeave())return;
  // Discarded edits are reloaded before a batch may fill the current TXT.
  if(dirty()&&current)await load(current.id);
  asr=await api('asr/start',{}); message(t('batchStartNotice')); paint();
});
$('batchStop').onclick=()=>run(async()=>{asr=await api('asr/stop',{});message(t('batchStopRequested'));});
$('retranscribe').onclick=()=>run(async()=>{
  if(!await allowLeave())return;
  message(t('singleWorking')); const ident=current.id;
  const result=await api('asr/item',{id:ident,version:current.version});
  if(current?.id!==ident)return;
  $('editor').value=result.text; updateControls(); message(t('singleReady'));
});
$('manifestUpdate').onclick=()=>run(async()=>{
  if(!await allowLeave())return;
  // Explicitly discarded edits must not appear to have entered the manifest.
  if(dirty()&&current)await load(current.id);
  message(t('manifestUpdating'));
  const result=await api('manifest/update',{role:context.role}); manifest=result.status; paintPipeline(); message(t('manifestUpdated'));notify('proofread-updated',{...context,manifest:result.status.manifest||''});
});
window.addEventListener('message',event=>{
  if(event.origin!==location.origin||event.source!==window.parent||event.data?.type!=='proofread-context')return;
  pendingContext=event.data;drainContext();
});
window.addEventListener('beforeunload',event=>{if(dirty()){event.preventDefault();event.returnValue='';}});
document.addEventListener('keydown',event=>{
  if($('unsaved').open)return;
  if((event.ctrlKey||event.metaKey)&&(event.key.toLowerCase()==='s'||event.key==='Enter')){event.preventDefault();if(current&&!busy)run(event.key==='Enter'?saveNext:()=>save(false));}
  else if(event.altKey&&event.code==='Space'){event.preventDefault();if(current){const audio=$('audio');if(audio.paused)audio.play().catch(error=>message(error.message,true));else audio.pause();}}
});
localize();
run(async()=>{
  const data=await api('session',{}); await acceptSnapshot(data); ready=true; paint(); notify('proofread-ready');
});
setInterval(poll,1500);
</script>
</body>
